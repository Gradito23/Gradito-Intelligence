# Supabase local development config
# Link to remote project: supabase link --project-ref enftlfmjakfcgaapzesx

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/accept-invite", "http://localhost:5173/reset-password"]

[storage]
enabled = true

[functions.onboarding-guide-email]
verify_jwt = false
